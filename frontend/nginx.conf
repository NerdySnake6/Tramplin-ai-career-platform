map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_user_agent $is_bot {
    default 0;
    ~*(googlebot|bingbot|yandexbot|vkshare|telegrambot|twitterbot|slurp|duckduckbot|baiduspider|lighthouse|chrome-lighthouse) 1;
}

map $host $tramplin_csp {
