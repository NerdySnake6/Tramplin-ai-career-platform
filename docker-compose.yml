services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      TRAMPLIN_DATABASE_PATH: /data/tramplin.db
      TRAMPLIN_SECRET_KEY: ${TRAMPLIN_SECRET_KEY:-change_me_on_vps}
      TRAMPLIN_ADMIN_EMAIL: ${TRAMPLIN_ADMIN_EMAIL:-}
      TRAMPLIN_ADMIN_PASSWORD: ${TRAMPLIN_ADMIN_PASSWORD:-}
      TRAMPLIN_ADMIN_NAME: ${TRAMPLIN_ADMIN_NAME:-}
      TRAMPLIN_AUTO_VERIFY_EMPLOYERS: ${TRAMPLIN_AUTO_VERIFY_EMPLOYERS:-false}
      YANDEX_GEOCODER_API_KEY: ${YANDEX_GEOCODER_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Трамплин}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-https://tramplin.site/api}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-https://tramplin.site}
      EMAIL_VERIFICATION_TTL_MINUTES: ${EMAIL_VERIFICATION_TTL_MINUTES:-60}
    volumes:
      - tramplin_backend_data:/data
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_YANDEX_MAPS_API_KEY: ${VITE_YANDEX_MAPS_API_KEY:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  tramplin_backend_data:
