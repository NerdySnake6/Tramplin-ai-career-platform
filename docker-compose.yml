services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tramplin_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tramplin_password}
      POSTGRES_DB: ${POSTGRES_DB:-tramplin_db}
    volumes:
      - tramplin_postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      TRAMPLIN_DATABASE_URL: postgresql://${POSTGRES_USER:-tramplin_user}:${POSTGRES_PASSWORD:-tramplin_password}@db:5432/${POSTGRES_DB:-tramplin_db}
      TRAMPLIN_SECRET_KEY: ${TRAMPLIN_SECRET_KEY:-change_me_on_vps}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-43200}
      TRAMPLIN_ADMIN_EMAIL: ${TRAMPLIN_ADMIN_EMAIL:-}
      TRAMPLIN_ADMIN_PASSWORD: ${TRAMPLIN_ADMIN_PASSWORD:-}
      TRAMPLIN_ADMIN_NAME: ${TRAMPLIN_ADMIN_NAME:-}
      TRAMPLIN_CURATOR_EMAIL: ${TRAMPLIN_CURATOR_EMAIL:-}
      TRAMPLIN_CURATOR_PASSWORD: ${TRAMPLIN_CURATOR_PASSWORD:-}
      TRAMPLIN_CURATOR_NAME: ${TRAMPLIN_CURATOR_NAME:-}
      TRAMPLIN_AUTO_VERIFY_EMPLOYERS: ${TRAMPLIN_AUTO_VERIFY_EMPLOYERS:-false}
      YANDEX_GEOCODER_API_KEY: ${YANDEX_GEOCODER_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Трамплин}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-https://tramplin.site/api}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-https://tramplin.site}
      EMAIL_VERIFICATION_TTL_MINUTES: ${EMAIL_VERIFICATION_TTL_MINUTES:-60}
      AI_FEATURES_ENABLED: ${AI_FEATURES_ENABLED:-false}
      POLZA_API_KEY: ${POLZA_API_KEY:-}
      POLZA_API_BASE_URL: ${POLZA_API_BASE_URL:-https://polza.ai/api/v1}
      POLZA_MODEL: ${POLZA_MODEL:-openai/gpt-5.4-mini}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-20}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-3000}
      AI_RATE_LIMIT_WINDOW_SECONDS: ${AI_RATE_LIMIT_WINDOW_SECONDS:-60}
      AI_RATE_LIMIT_MAX_REQUESTS: ${AI_RATE_LIMIT_MAX_REQUESTS:-10}
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_YANDEX_MAPS_API_KEY: ${VITE_YANDEX_MAPS_API_KEY:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  tramplin_postgres_data:
